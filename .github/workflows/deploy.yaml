name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [lts/*]

    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Setup node env
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable
      
      - name: Run hardhat node, deploy contracts (& generate contracts typescript output)
        run: yarn chain & yarn deploy

      - name: Run hardhat lint
        run: yarn hardhat:lint --max-warnings=0

      - name: Run nextjs lint
        run: yarn next:lint --max-warnings=0

      - name: Check typings on nextjs
        run: yarn next:check-types

      - name: Build nextjs
        run: yarn next:build

      - name: Codegen Ponder
        run: yarn ponder:codegen

      - name: Build storage
        working-directory: packages/storage
        run: yarn build

      - name: Check ML syntax
        run: python -m py_compile packages/ml/server.py packages/ml/services/recommender.py

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Setup node env
        uses: actions/setup-node@v3
        with:
          node-version: lts/*
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Deploy client
        env:
          RENDER_CLIENT_DEPLOY_HOOK: ${{ secrets.RENDER_CLIENT_DEPLOY_HOOK }}
        run: |
          curl -fsSL -X POST "${RENDER_CLIENT_DEPLOY_HOOK}"

      - name: Deploy ponder
        env:
          RENDER_PONDER_DEPLOY_HOOK: ${{ secrets.RENDER_PONDER_DEPLOY_HOOK }}
        run: |
          curl -fsSL -X POST "${RENDER_PONDER_DEPLOY_HOOK}"

      - name: Deploy ml
        env:
          RENDER_ML_DEPLOY_HOOK: ${{ secrets.RENDER_ML_DEPLOY_HOOK }}
        run: |
          curl -fsSL -X POST "${RENDER_ML_DEPLOY_HOOK}"

      - name: Deploy storage
        env:
          RENDER_STORAGE_DEPLOY_HOOK: ${{ secrets.RENDER_STORAGE_DEPLOY_HOOK }}
        run: |
          curl -fsSL -X POST "${RENDER_STORAGE_DEPLOY_HOOK}"
      
