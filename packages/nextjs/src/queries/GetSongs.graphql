query GetSongs($nameContains: String, $limit: Int = 100) {
  songss(
    orderBy: "blockTimestamp"
    orderDirection: "desc"
    where: { name_contains: $nameContains }
    limit: $limit
  ) {
    items {
      songId
      name
      audioCID
      blockTimestamp
      transactionHash
    }
  }
}
