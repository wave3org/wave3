name: wave3
services:
  client:
    build:
      dockerfile: packages/nextjs/Dockerfile
    ports:
      - "3000:3000"
  ponder:
    build:
      context: .
      dockerfile: packages/ponder/Dockerfile
    ports:
      - "42069:42069"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://wave3:wave3@postgres:5432/wave3
      DATABASE_SCHEMA: public
      PONDER_RPC_URL_31337: http://host.docker.internal:8545
    extra_hosts:
      - "host.docker.internal:host-gateway"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wave3
      POSTGRES_PASSWORD: wave3
      POSTGRES_DB: wave3
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wave3 -d wave3"]
      interval: 5s
      timeout: 5s
      retries: 5
  ipfs:
    image: ipfs/kubo:latest
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs_data:/data/ipfs
  ml:
    build:
      context: .
      dockerfile: packages/ml/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wave3:wave3@postgres:5432/wave3
    volumes:
      - ./packages/ml:/app

volumes:
  postgres_data:
  ipfs_data:
