name: wave3
services:
  # Frontend - runs only in full mode (you run it locally with yarn dev)
  client:
    profiles: ["full"]
    build:
      dockerfile: packages/nextjs/Dockerfile
    ports:
      - "3000:3000"
  
  # Indexer - runs only in full mode (you run it locally with yarn dev)
  ponder:
    profiles: ["full"]
    build:
      context: .
      dockerfile: packages/ponder/Dockerfile
    ports:
      - "42069:42069"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://wave3:wave3@postgres:5432/wave3
      DATABASE_SCHEMA: wave3
      PONDER_RPC_URL_31337: http://host.docker.internal:8545
    extra_hosts:
      - "host.docker.internal:host-gateway"
  
  # Database - always runs (helper service)
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wave3
      POSTGRES_PASSWORD: wave3
      POSTGRES_DB: wave3
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/ponder/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wave3 -d wave3"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  # IPFS - always runs (helper service)
  ipfs:
    image: ipfs/kubo:latest
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs_data:/data/ipfs
  
  # Storage Service - always runs (helper service with IPFS)
  storage:
    profiles: ["full"]
    build:
      context: .
      dockerfile: packages/storage/Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      ipfs:
        condition: service_started
    environment:
      IPFS_API_URL: http://ipfs:5001
    volumes:
      - ./packages/storage:/app
  
  # ML Service - runs only in full mode (you run it locally most of the time)
  ml:
    profiles: ["full"]
    build:
      context: .
      dockerfile: packages/ml/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started
    environment:
      PONDER_URL: http://ponder:42069
      STORAGE_URL: http://storage:3001
    volumes:
      - ./packages/ml:/app

volumes:
  postgres_data:
  ipfs_data:
